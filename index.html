<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PreEmployment.ph · Requirements guide for first-time job seekers</title>
    <meta
      name="description"
      content="A free, step-by-step guide to pre-employment requirements in the Philippines: PSA, NBI, police and barangay clearances, SSS, Pag-IBIG, PhilHealth, and TIN. Learn how to get most of them free under RA 11261."
    />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Light and dark appearance -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#172019" media="(prefers-color-scheme: dark)" />

    <!-- Link previews on Facebook, Messenger, LinkedIn, X, etc.
         %VITE_SITE_URL% is replaced at build time with the value in .env -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PreEmployment.ph" />
    <meta property="og:title" content="PreEmployment.ph · Your first job starts with the right papers" />
    <meta
      property="og:description"
      content="Free step-by-step guide to pre-employment requirements in the Philippines, with a checklist you can print."
    />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A brown envelope holding the documents a first-time job seeker needs"
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
